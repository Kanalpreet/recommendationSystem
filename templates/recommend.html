<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommendation</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Grid -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            background: white;
            border: none;
            padding: 18px 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 22px;
            color: #ee0979 !important;
        }

        .nav > li > a {
            color: #333 !important;
            font-weight: 500;
        }

        .nav > li > a:hover {
            background: transparent;
            color: #ee0979 !important;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 60px 0 30px 0;
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 700;
        }

        .hero p {
            color: #666;
            font-size: 16px;
        }

        /* SEARCH BOX */
        .search-box {
            max-width: 600px;
            margin: 30px auto;
        }

        .search-box input {
            height: 50px;
            border-radius: 12px;
            border: 1px solid #ddd;
            padding: 10px 15px;
            font-size: 15px;
            box-shadow: none;
        }

        .search-box input:focus {
            border-color: #ee0979;
            box-shadow: 0 0 0 3px rgba(238,9,121,0.15);
        }

        .search-btn {
            margin-top: 15px;
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .search-btn:hover {
            opacity: 0.9;
        }

        /* CARD */
        .book-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 35px;
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        .book-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .book-content {
            padding: 18px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .book-author {
            font-size: 14px;
            color: #888;
        }

        .container {
            margin-top: 20px;
        }

    </style>
</head>

<body>

<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">BookSphere</a>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container">

    <div class="hero">
        <h1>Find Similar Books</h1>
        <p>Enter a book name to discover recommendations</p>
    </div>

    <div class="search-box text-center">
        <form action="/recommend_books" method="post">
            <input name="user_input" type="text" class="form-control" placeholder="Enter a book name...">
            <button type="submit" class="search-btn">Recommend</button>
        </form>
    </div>

    <div class="row">
        {% if data %}
            {% for i in data %}
            <div class="col-md-3 col-sm-6">
                <div class="book-card">
                    <img src="{{ i[2] }}" alt="Book Cover">
                    <div class="book-content">
                        <div class="book-title">{{ i[0] }}</div>
                        <div class="book-author">by {{ i[1] }}</div>
                    </div>
                </div>
            </div>
            {% endfor %}
        {% endif %}
    </div>

</div>

</body>
</html>
