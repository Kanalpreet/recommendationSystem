<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommendation System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Grid -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            background: white;
            border: none;
            padding: 18px 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 22px;
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            background-clip:text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav > li > a {
            color: #333 !important;
            font-weight: 500;
        }

        .nav > li > a:hover {
            background: transparent;
            color: #ee0979 !important;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 60px 0 30px 0;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 17px;
            color: #666;
        }

        /* CARD */
        .book-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 35px;
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        .book-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .book-content {
            padding: 18px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .book-author {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }

        .meta {
            font-size: 13px;
            color: #555;
        }

        .rating-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            color: white;
            margin-top: 6px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">BookSphere</a>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container">

    <div class="hero">
        <h1>Explore the Most Loved Books</h1>
        <p>Smart recommendations powered by collaborative filtering</p>
    </div>

    <div class="row">
        {% for i in range(book_name|length) %}
        <div class="col-md-3 col-sm-6">
            <div class="book-card">
                <img src="{{ image[i] }}" alt="Book Cover">
                <div class="book-content">
                    <div class="book-title">{{ book_name[i] }}</div>
                    <div class="book-author">by {{ author[i] }}</div>
                    <div class="meta">Votes: {{ votes[i] }}</div>
                    <div class="rating-badge">⭐ {{ ratings[i] }}</div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
